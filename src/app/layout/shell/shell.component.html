<div class="app-shell"><app-sidebar/><div class="main-column"><app-header/><main class="page-area"><section class="panel loading-panel" *ngIf="store.loading()" role="status"><h2>Loading your workspace…</h2><p>Fetching the records your account can access.</p></section><section class="panel loading-panel" *ngIf="!store.loading()&&store.loadError()" role="alert"><h2>Workspace unavailable</h2><p>{{store.loadError()}}</p><button class="primary" (click)="reload()">Retry</button></section><router-outlet *ngIf="!store.loading()&&!store.loadError()"/></main></div></div>
